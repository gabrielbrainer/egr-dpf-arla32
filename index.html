<style>
/* =====================================================================
   ESTILOS  (cores no bloco :root — fácil de trocar)
   ===================================================================== */
:root{
  --petrol:#0b4f5c;       /* azul-petróleo principal */
  --petrol-dark:#073842;
  --green:#1f7a4d;        /* verde saúde */
  --green-soft:#e6f4ec;
  --orange:#f59e0b;       /* destaque dos botões */
  --orange-dark:#d97706;
  --alert-bg:#fff4d6;
  --alert-line:#b45309;
  --bg:#f4f9f8;
  --card:#ffffff;
  --ink:#14232a;          /* texto (contraste AA sobre branco) */
  --muted:#41555c;
  --line:#cfe0e0;
  --radius:16px;
  --shadow:0 2px 10px rgba(7,56,66,.10);
  --nav-h:60px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px;line-height:1.6;color:var(--ink);background:var(--bg);
}
img,svg{max-width:100%}
h1,h2,h3{line-height:1.2;color:var(--petrol-dark);margin:0 0 .5em}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:62ch}
a{color:var(--petrol)}
:focus-visible{outline:3px solid var(--orange-dark);outline-offset:3px;border-radius:6px}
.container{width:100%;max-width:1060px;margin:0 auto;padding:0 18px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;z-index:200;border-radius:8px}
.skip:focus{top:8px}
.ico{width:1.6em;height:1.6em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Botões (altura mínima 48px) ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:52px;padding:12px 22px;border-radius:999px;border:2px solid transparent;
  font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center;
  transition:transform .15s,background .15s;
}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--orange);color:#1a1200}
.btn-main:hover{background:#ffb52e}
.btn-ghost{background:transparent;color:#fff;border-color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-line{background:#fff;color:var(--petrol-dark);border-color:var(--petrol)}
.btn-line:hover{background:var(--green-soft)}
.btn-wa{background:#128c4a;color:#fff}
.btn-tg{background:#1c6fa8;color:#fff}
.btn-copy{background:var(--petrol-dark);color:#fff}
.btn-sm{min-height:48px;padding:8px 16px;font-size:.95rem}
.btn-wa:hover,.btn-tg:hover,.btn-copy:hover{filter:brightness(1.12)}

/* ---------- Menu fixo ---------- */
header.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--petrol-dark);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h)}
.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;min-height:48px}
.brand span{color:var(--orange)}
.nav-toggle{background:none;border:2px solid #fff;color:#fff;border-radius:10px;min-width:48px;min-height:48px;font:inherit;font-weight:700;cursor:pointer}
.nav-links{display:none;list-style:none;margin:0;padding:6px 18px 14px;background:var(--petrol-dark)}
.nav-links.open{display:block}
.nav-links a{display:flex;align-items:center;min-height:48px;color:#fff;text-decoration:none;font-weight:600;border-bottom:1px solid rgba(255,255,255,.15)}
.nav-links a[aria-current="true"]{color:var(--orange)}
@media(min-width:860px){
  .nav-toggle{display:none}
  .nav-links{display:flex!important;gap:6px;padding:0;background:none}
  .nav-links a{border:0;padding:0 12px;border-radius:8px}
  .nav-links a:hover{background:rgba(255,255,255,.12)}
}

/* ---------- Seções ---------- */
section{padding:56px 0;scroll-margin-top:var(--nav-h)}
section.alt{background:#fff}
.sec-title{display:flex;align-items:center;gap:12px;color:var(--petrol)}
.sec-title .ico{width:2em;height:2em;background:var(--green-soft);color:var(--green);padding:8px;border-radius:14px;stroke-width:1.7}
.lead{font-size:1.1rem;color:var(--muted)}
.grid{display:grid;gap:16px}
@media(min-width:700px){.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card .ico{width:2.4em;height:2.4em;color:var(--green);margin-bottom:6px}
.tag{display:inline-block;background:var(--green-soft);color:#0f5132;font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px;border:1px solid #b9dcc8}
.term{border-bottom:2px dotted var(--petrol);cursor:help;text-decoration:none}
.alert{background:var(--alert-bg);border-left:6px solid var(--alert-line);padding:16px 18px;border-radius:10px;margin:20px 0}
.alert strong:first-child{color:#7c3a06}
.alert p:last-child{margin:0}
.alert > .ico{display:block;color:var(--alert-line);margin-bottom:6px}

/* ---------- Hero ---------- */
#inicio{padding:calc(var(--nav-h) + 40px) 0 56px;color:#fff;background:linear-gradient(150deg,var(--petrol-dark),var(--petrol) 55%,#17695c);position:relative;overflow:hidden}
#inicio h1{color:#fff;font-size:1.9rem}
#inicio .sub{font-size:1.6rem;font-weight:800;color:var(--orange);margin:0 0 .6em}
#inicio p{max-width:52ch}
.hero-grid{display:grid;gap:28px;align-items:center}
@media(min-width:800px){.hero-grid{grid-template-columns:1.3fr .7fr}#inicio h1{font-size:2.5rem}}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hero-btns .btn{flex:1 1 220px}
.hero-art{position:relative;background:rgba(255,255,255,.08);border-radius:28px;padding:28px;display:flex;justify-content:center}
.hero-art .ico{width:140px;height:140px;color:#fff;stroke-width:1.2}
.puff{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.55);left:14%;bottom:36%;animation:rise 4s ease-in infinite;opacity:0}
.puff:nth-of-type(2){animation-delay:1.3s;left:10%;width:10px;height:10px}
.puff:nth-of-type(3){animation-delay:2.6s;left:18%;width:8px;height:8px}
@keyframes rise{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(-40px,-90px);opacity:0}}

/* ---------- Sistemas ---------- */
.sys h3{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sys .analogia{background:var(--green-soft);border-radius:10px;padding:10px 12px;font-weight:600;color:#0f5132;margin:10px 0 14px}
.sys dl{margin:0}
.sys dt{font-weight:800;color:var(--petrol);margin-top:12px}
.sys dd{margin:2px 0 0}
.sys dd.warn{background:var(--alert-bg);border-left:5px solid var(--alert-line);padding:8px 12px;border-radius:8px}

/* ---------- Vídeos ---------- */
.ep{padding:0;overflow:hidden;display:flex;flex-direction:column}
.player{position:relative;aspect-ratio:16/9;background:var(--petrol-dark);color:#fff;display:flex;align-items:center;justify-content:center}
.player iframe,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player-btn{position:relative;z-index:1;background:var(--orange);color:#1a1200;border:0;border-radius:999px;min-height:56px;padding:0 22px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.player-ph{text-align:center;padding:14px;font-size:.95rem}
.player-ph code{background:rgba(255,255,255,.18);padding:2px 6px;border-radius:6px}
.ep-body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ep-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ep-num{font-weight:800;color:var(--green)}
.ep-body h3{margin:0}
.ep-actions{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Mito ou verdade (cartões que viram) ---------- */
.flip{all:unset;box-sizing:border-box;display:grid;cursor:pointer;perspective:900px;min-height:220px;border-radius:var(--radius)}
.flip:focus-visible{outline:3px solid var(--orange-dark);outline-offset:4px}
.face{grid-area:1/1;border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s;box-shadow:var(--shadow)}
.face.front{background:var(--petrol);color:#fff;border:2px solid var(--petrol-dark)}
.face.back{background:#fff;border:3px solid var(--green);transform:rotateY(180deg)}
.face.back.is-myth{border-color:var(--alert-line)}
.flip[aria-pressed="true"] .front{transform:rotateY(180deg)}
.flip[aria-pressed="true"] .back{transform:rotateY(0)}
.q{font-size:1.15rem;font-weight:700}
.hint{font-size:.9rem;opacity:.9;display:flex;align-items:center;gap:6px}
.verdict{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.verdict.myth{color:#8a3d05}
.verdict.truth{color:#0f5132}
.verdict .ico{width:1.4em;height:1.4em;margin:0}

/* ---------- Quiz ---------- */
.quiz{max-width:720px;margin:0 auto}
progress{width:100%;height:12px;accent-color:var(--green);margin:6px 0 14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 16px;margin:0 0 10px;font:inherit;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--petrol)}
.opt:disabled{cursor:default}
.opt .mark{font-weight:800;width:1.4em;flex:none}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--alert-line);background:var(--alert-bg)}
.feedback{border-radius:12px;padding:14px 16px;margin:6px 0 14px;background:#fff;border:2px solid var(--line)}
.feedback strong{display:block}
.result{text-align:center}
.result .score{font-size:3rem;font-weight:800;color:var(--green);margin:0}
.result p{margin-left:auto;margin-right:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

/* ---------- Impacto coletivo ---------- */
.chain{list-style:none;margin:20px 0;padding:0;display:grid;gap:0}
.chain li{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;position:relative}
.chain li+li{margin-top:26px}
.chain li+li::before{content:"▼";position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:var(--petrol);font-size:1rem}
.chain .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--petrol);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.chain li:last-child{border-color:var(--alert-line);background:var(--alert-bg)}
@media(min-width:900px){
  .chain{grid-template-columns:repeat(5,1fr);gap:26px}
  .chain li{flex-direction:column;text-align:center;height:100%}
  .chain li+li{margin-top:0}
  .chain li+li::before{content:"►";top:50%;left:-22px;transform:translateY(-50%)}
}
.ph{border:2px dashed var(--petrol);border-radius:12px;padding:14px;color:var(--muted);background:#fff;font-weight:600}

/* ---------- FAQ ---------- */
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
summary{cursor:pointer;min-height:56px;padding:12px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;color:var(--petrol-dark)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.6rem;color:var(--green);flex:none}
details[open] summary::after{content:"–"}
details .ans{padding:0 18px 14px}
details .ans p:last-child{margin:0}

/* ---------- Compartilhe ---------- */
#compartilhe{background:linear-gradient(150deg,var(--green),var(--petrol));color:#fff}
#compartilhe h2,#compartilhe .sec-title{color:#fff}
#compartilhe .sec-title .ico{background:rgba(255,255,255,.18);color:#fff}
#compartilhe .lead{color:#fff}
.share-big{display:grid;gap:12px;max-width:520px}
.share-big .btn{min-height:64px;font-size:1.15rem;width:100%}
.status{min-height:1.6em;font-weight:700;margin-top:8px}

/* ---------- Fontes ---------- */
.src-group{margin-bottom:22px}
.src-list{list-style:none;padding:0;margin:0}
.src-list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.src-list .need{color:#8a3d05;font-weight:700}
.src-list .chk{font-size:.85rem;font-weight:700;color:#7c3a06;background:var(--alert-bg);border-radius:6px;padding:2px 8px;margin-left:6px;white-space:nowrap}

/* ---------- Sobre / rodapé ---------- */
.team{list-style:none;padding:0;margin:0;display:grid;gap:10px}
@media(min-width:700px){.team{grid-template-columns:repeat(2,1fr)}}
.team li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:600}
.team .ico{color:var(--green)}
footer{background:var(--petrol-dark);color:#e6f0f0;padding:30px 0 90px;font-size:.95rem}
footer a{color:#ffd37a}
footer p{max-width:70ch}

/* ---------- Voltar ao topo ---------- */
#topo{position:fixed;right:14px;bottom:14px;z-index:90;width:56px;height:56px;border-radius:50%;border:0;background:var(--orange);color:#1a1200;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;display:none;align-items:center;justify-content:center}
#topo.show{display:flex}
#topo .ico{width:28px;height:28px;stroke-width:2.4}

/* ---------- Movimento reduzido ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .puff{animation:none;display:none}
  .face,.btn{transition:none}
}
noscript .alert{margin:80px 18px 0}
</style>
</head>

      `<div class="grid c2">${c.cards.map(k => `
        <button class="flip" type="button" aria-pressed="false">
          <span class="face front"><span class="q">“${k.afirmacao}”</span><span class="hint">${icon("i-hand")}${r.dica}</span></span>
          <span class="face back ${k.eMito ? "is-myth" : ""}" aria-hidden="true">
            <span class="verdict ${k.eMito ? "myth" : "truth"}">${icon(k.eMito ? "i-x" : "i-check")}${k.eMito ? r.mito : r.verdade}</span>
            <span>${k.resposta}</span>
          </span>
        </button>`).join("")}</div>`);
    $$("#mito .flip").forEach(b => b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", String(!on));
      $(".front", b).setAttribute("aria-hidden", String(!on));
      $(".back", b).setAttribute("aria-hidden", String(on));
    }));
  })();

  /* ---------- 6. Quiz ---------- */
  (function () {
    const c = CONFIG.quiz, Q = c.perguntas;
    put("quiz", secTitle("h-quiz", "i-quiz", c.titulo) + `<p class="lead">${c.intro}</p><div class="quiz card" id="quizBox"></div>`);
    const box = $("#quizBox");
    let i = 0, score = 0;

    function show() {
      const q = Q[i];
      box.innerHTML = `
        <p><strong>Pergunta ${i + 1} de ${Q.length}</strong></p>
        <progress max="${Q.length}" value="${i}" aria-label="Progresso do quiz"></progress>
        <h3 id="qq" tabindex="-1">${q.p}</h3>
        <div role="group" aria-labelledby="qq">${q.opcoes.map((o, k) =>
          `<button type="button" class="opt" data-k="${k}"><span class="mark" aria-hidden="true">${"ABC"[k]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="fb" role="status" aria-live="polite"></div>`;
      $("#qq").focus({ preventScroll: true });
      $$(".opt", box).forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
    }

    function answer(k) {
      const q = Q[i], ok = k === q.certa;
      if (ok) score++;
      $$(".opt", box).forEach(b => {
        b.disabled = true;
        const n = +b.dataset.k;
        // Não depende só de cor: ✔ / ✘ aparecem no texto.
        if (n === q.certa) { b.classList.add("right"); $(".mark", b).textContent = "✔"; }
        else if (n === k)  { b.classList.add("wrong"); $(".mark", b).textContent = "✘"; }
      });
      const last = i === Q.length - 1;
      $("#fb").innerHTML = `
        <div class="feedback">
          <strong>${ok ? "✔ Isso mesmo!" : "✘ Quase! A resposta certa é a opção " + "ABC"[q.certa] + "."}</strong>
          <span>${q.explica}</span>
        </div>
        <button type="button" class="btn btn-main" id="next">${last ? "Ver resultado" : "Próxima pergunta"}</button>`;
      const nx = $("#next"); nx.focus();
      nx.addEventListener("click", () => { i++; i < Q.length ? show() : finish(); });
    }

    function finish() {
      const msg = [...c.mensagens].reverse().find(m => score >= m.min).texto;
      const texto = `Acertei ${score} de ${Q.length} no quiz sobre EGR, DPF e ARLA 32. Teste você também:`;
      const l = shareLinks(texto, siteUrl() + "#quiz");
      box.innerHTML = `
        <div class="result">
          <h3 id="res" tabindex="-1">Seu resultado</h3>
          <p class="score">${score} / ${Q.length}</p>
          <p>${msg}</p>
          <div class="row">
            <a class="btn btn-wa" href="${l.wa}" target="_blank" rel="noopener">Compartilhar no WhatsApp</a>
            <a class="btn btn-tg" href="${l.tg}" target="_blank" rel="noopener">Telegram</a>
            <button class="btn btn-copy" type="button" id="qcopy">Copiar link</button>
          </div>
          <div class="row"><button class="btn btn-line" type="button" id="again">↻ Refazer o quiz</button><a class="btn btn-line" href="#videos">Ver os vídeos</a></div>
          <div class="status" role="status" aria-live="polite" id="qst"></div>
        </div>`;
      $("#res").focus({ preventScroll: true });
      $("#qcopy").addEventListener("click", () => copyText(siteUrl() + "#quiz", $("#qst")));
      $("#again").addEventListener("click", () => { i = 0; score = 0; show(); });
    }
    show();
  })();

  /* ---------- 7. Impacto coletivo ---------- */
  (function () {
    const c = CONFIG.impacto;
    put("impacto",
      secTitle("h-impacto", "i-people", c.titulo) +
      `<p class="lead">${c.intro}</p>` +
      `<ol class="chain">${c.cadeia.map((t, k) => `<li><span class="n" aria-hidden="true">${k + 1}</span><span>${t}</span></li>`).join("")}</ol>` +
      `<div class="grid c2">${c.blocos.map(b => `
        <article class="card">${icon(b.icone)}<h3>${b.titulo}</h3><p>${b.texto}</p><p class="ph">${b.dado}</p></article>`).join("")}</div>` +
      `<div class="alert">${icon("i-scale")}<p>${c.alerta}</p></div>`);
  })();

  /* ---------- 8. FAQ ---------- */
  (function () {
    const c = CONFIG.faq;
    put("faq", secTitle("h-faq", "i-ask", c.titulo) +
      c.itens.map(f => `<details><summary>${f.p}</summary><div class="ans"><p>${f.r}</p></div></details>`).join(""));
  })();

  /* ---------- 9. Compartilhe ---------- */
  (function () {
    const c = CONFIG.compartilhe;
    const l = shareLinks(CONFIG.site.textoCompartilhar, siteUrl());
    put("compartilhe",
      secTitle("h-compartilhe", "i-share", c.titulo) +
      `<p class="lead">${c.intro}</p>
       <div class="share-big">
         <a class="btn btn-wa" href="${l.wa}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
         <a class="btn btn-tg" href="${l.tg}" target="_blank" rel="noopener">Enviar pelo Telegram</a>
         <button class="btn btn-copy" type="button" data-copy="${siteUrl()}">Copiar link do site</button>
       </div>
       <div class="status" role="status" aria-live="polite" id="shareStatus"></div>`);
  })();

  // Botões "Copiar link" (vídeos e compartilhe)
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-copy]");
    if (!b) return;
    const st = $(".status", b.parentElement.parentElement) || $("#shareStatus");
    copyText(b.dataset.copy, b.closest("#compartilhe") ? $("#shareStatus") : st);
  });

  /* ---------- 10. Fontes ---------- */
  (function () {
    const c = CONFIG.fontes;
    put("fontes",
      secTitle("h-fontes", "i-book", c.titulo) +
      `<p class="lead">${c.intro}</p>` +
      c.grupos.map(g => `
        <div class="src-group"><h3>${g.nome}</h3>
          <ul class="src-list">${g.itens.map(it => `
            <li>${it.texto.includes("[inserir") ? it.texto.replace(/(\[inserir[^\]]*\])/g, '<span class="need">$1</span>') : it.texto}
              ${it.link ? ` <a href="${it.link}" target="_blank" rel="noopener">Abrir fonte</a>` : ` <span class="need">[inserir link]</span>`}
              ${it.verificar ? `<span class="chk">confirmar antes de publicar</span>` : ""}
            </li>`).join("")}</ul>
        </div>`).join(""));
  })();

  /* ---------- 11. Sobre ---------- */
  (function () {
    const c = CONFIG.sobre;
    put("sobre",
      secTitle("h-sobre", "i-school", c.titulo) +
      `<p>${c.texto}</p>
       <h3>Equipe discente</h3>
       <ul class="team">${c.equipe.map(n => `<li>${icon("i-user")}${n}</li>`).join("")}</ul>` +
      (c.contato ? `<p style="margin-top:16px">Contato: <a href="mailto:${c.contato}">${c.contato}</a></p>` : ""));
  })();

  /* ---------- Menu móvel ---------- */
  const toggle = $("#navToggle"), links = $("#navLinks");
  toggle.addEventListener("click", () => {
    const open = links.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
  });
  $$("a", links).forEach(a => a.addEventListener("click", () => {
    links.classList.remove("open"); toggle.setAttribute("aria-expanded", "false");
  }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") { links.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); } });

  /* ---------- Destaque do item de menu da seção atual ---------- */
  if ("IntersectionObserver" in window) {
    const map = {};
    $$("a", links).forEach(a => map[a.getAttribute("href").slice(1)] = a);
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && map[e.target.id]) {
        $$("a", links).forEach(a => a.removeAttribute("aria-current"));
        map[e.target.id].setAttribute("aria-current", "true");
      }
    }), { rootMargin: "-40% 0px -55% 0px" });
    Object.keys(map).forEach(id => { const s = document.getElementById(id); if (s) io.observe(s); });
  }

  /* ---------- Voltar ao topo ---------- */
  const topo = $("#topo");
  addEventListener("scroll", () => topo.classList.toggle("show", scrollY > 600), { passive: true });
  topo.addEventListener("click", () => { scrollTo({ top: 0 }); $("#inicio h1").setAttribute("tabindex", "-1"); $("#inicio h1").focus({ preventScroll: true }); });

  // Se abrir com link direto (#ep2, #quiz), rola até o ponto depois de montar a página
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 50); }
})();
</script>
</body>
</html>
